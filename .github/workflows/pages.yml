name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce publication gate
        shell: python
        run: |
          import ipaddress
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path.cwd()
          manifest = json.loads((root / "site" / "site-manifest.json").read_text(encoding="utf-8"))
          parsed = urlparse(str(manifest.get("base_url", "")))
          host = (parsed.hostname or "").lower()
          allowed_hosts = {"majiayu000.github.io"}

          def host_is_blocked(hostname: str) -> bool:
              if not hostname or hostname == "localhost":
                  return True
              try:
                  addr = ipaddress.ip_address(hostname)
              except ValueError:
                  return hostname not in allowed_hosts
              return (
                  addr.is_loopback
                  or addr.is_private
                  or addr.is_link_local
                  or addr.is_unspecified
                  or addr.is_multicast
                  or hostname not in allowed_hosts
              )

          failures = []
          if manifest.get("publish_ready") is not True:
              failures.append("site manifest is not marked publish_ready")
          if parsed.scheme != "https" or host_is_blocked(host):
              failures.append(
                  "base_url must be an HTTPS URL on majiayu000.github.io "
                  "(not loopback, private, link-local, unspecified, or multicast)"
              )
          license_path = root / "LICENSE"
          if not license_path.is_file() or license_path.is_symlink():
              failures.append("a regular LICENSE file is required")
          if failures:
              raise SystemExit("Publication blocked: " + "; ".join(failures))
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
