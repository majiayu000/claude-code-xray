name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site.sha256"
      - "LICENSE"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce publication gate
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          site_root = root / "site"
          manifest = json.loads((site_root / "site-manifest.json").read_text(encoding="utf-8"))

          failures = []
          if manifest.get("publish_ready") is not True:
              failures.append("site manifest is not marked publish_ready")
          if manifest.get("base_url") != "https://majiayu000.github.io/claude-code-xray/":
              failures.append(
                  "base_url must be an HTTPS URL on majiayu000.github.io "
                  "with the exact URL https://majiayu000.github.io/claude-code-xray/"
              )
          license_path = root / "LICENSE"
          if not license_path.is_file() or license_path.is_symlink():
              failures.append("a regular LICENSE file is required")

          on_disk = {
              path.relative_to(site_root).as_posix()
              for path in site_root.rglob("*")
              if path.is_file() and not path.is_symlink()
          }
          digests = {
              rel: hashlib.sha256((site_root / rel).read_bytes()).hexdigest()
              for rel in on_disk
          }
          checksums = {}
          for line in (root / "site.sha256").read_text(encoding="utf-8").splitlines():
              expected, rel = line.split("  ", 1)
              if rel in checksums:
                  failures.append(f"{rel}: duplicate path in site.sha256")
                  continue
              checksums[rel] = expected
              if rel in digests and digests[rel] != expected.lower():
                  failures.append(f"{rel}: sha256 mismatch in site.sha256")

          missing_on_disk = sorted(checksums.keys() - on_disk)
          extra_on_disk = sorted(on_disk - checksums.keys())
          if missing_on_disk:
              failures.append(
                  "site.sha256 paths missing on disk: " + ", ".join(missing_on_disk)
              )
          if extra_on_disk:
              failures.append(
                  "files missing from site.sha256: " + ", ".join(extra_on_disk)
              )

          files = manifest.get("files")
          if not isinstance(files, list):
              failures.append("site manifest files[] must be a list")
              files = []

          manifest_paths = set()
          for entry in files:
              if not isinstance(entry, dict):
                  failures.append("site manifest files[] entry must be an object")
                  continue
              rel = entry.get("path")
              expected = entry.get("sha256")
              if not isinstance(rel, str) or not rel:
                  failures.append("site manifest files[] entry missing path")
                  continue
              if not isinstance(expected, str) or not expected:
                  failures.append(f"{rel}: missing sha256 digest")
                  continue
              if rel in manifest_paths:
                  failures.append(f"{rel}: duplicate path in site manifest")
                  continue
              manifest_paths.add(rel)

              target = site_root / rel
              if target.is_symlink():
                  failures.append(f"{rel}: must be a regular file, not a symlink")
                  continue
              if not target.is_file():
                  failures.append(f"{rel}: missing or not a regular file")
                  continue

              digest = digests.get(rel)
              if digest != expected.lower():
                  failures.append(
                      f"{rel}: sha256 mismatch (expected {expected}, got {digest})"
                  )

          missing_on_disk = sorted(manifest_paths - on_disk)
          extra_on_disk = sorted(
              rel for rel in on_disk - manifest_paths
              if Path(rel).name == "explainer.html"
          )
          if missing_on_disk:
              failures.append(
                  "manifest paths missing on disk: " + ", ".join(missing_on_disk)
              )
          if extra_on_disk:
              failures.append(
                  "explainer.html files missing from manifest: " + ", ".join(extra_on_disk)
              )

          if failures:
              raise SystemExit("Publication blocked: " + "; ".join(failures))
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
